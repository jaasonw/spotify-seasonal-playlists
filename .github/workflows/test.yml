name: Tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run tests
      env:
        client_id: test
        client_secret: test
        redirect_uri: test
        port: "5000"
        pocketbase_url: test
        pocketbase_username: test
        pocketbase_password: test
      run: |
        pytest src
